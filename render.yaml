services:
  # Socket.io server (must be deployed first)
  - type: web
    name: omuscle-socket
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:socket
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
  
  # Next.js web application
  - type: web
    name: omuscle-web
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
